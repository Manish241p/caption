      const match = timeLine.match(/(\\d{2}):(\\d{2}):(\\d{2})[,.](\\d{3})\\s*-->\\s*(\\d{2}):(\\d{2}):(\\d{2})[,.](\\d{3})/);
      if (!match) continue;

      const start = this.timeToSeconds(match[1], match[2], match[3], match[4]);
      const end = this.timeToSeconds(match[5], match[6], match[7], match[8]);

      // All remaining lines are caption text
      const textLines = lines.slice(timeLineIndex + 1).map((l) => l.trim()).filter(Boolean);
      const text = textLines.join('\\n');

      if (!text) continue;

      const words = this.estimateWords(text, start, end);

      captions.push({
        id: \`caption-\${Date.now()}-\${i + 1}\`,
        start: Math.max(0, start),
        end: Math.max(start + 0.1, end),
        text,
        words,
        style: defaultStyle,
        animation: defaultAnimation as any,
      });
    }

    return captions.sort((a, b) => a.start - b.start);
  }

  private static timeToSeconds(hours: string, minutes: string, seconds: string, ms: string): number {
    return parseInt(hours, 10) * 3600 +
      parseInt(minutes, 10) * 60 +
      parseInt(seconds, 10) +
      parseInt(ms, 10) / 1000;
  }

  static estimateWords(text: string, start: number, end: number): Word[] {
    const rawWords = text.trim().split(/\\s+/).filter(Boolean);
    if (rawWords.length === 0) return [];

    const duration = Math.max(0.1, end - start);
    const wordDuration = duration / rawWords.length;

    return rawWords.map((word, idx) => ({
      text: word,
      start: Number((start + idx * wordDuration).toFixed(3)),
      end: Number((start + (idx + 1) * wordDuration).toFixed(3)),
      timingType: 'estimated',
    }));
  }

  static stringify(captions: Caption[]): string {
    return SRTExporter.export(captions);
  }

  static downloadSRT(content: string, filename = 'captions.srt'): void {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
}

export class SRTExporter {
  /**
   * Export captions to standard SRT string format
   */
  static export(captions: Caption[]): string {
    const sorted = [...captions].sort((a, b) => a.start - b.start);
    return sorted
      .map((cap, idx) => {
        const indexStr = (idx + 1).toString();
        const startStr = this.secondsToSRTTime(cap.start);
        const endStr = this.secondsToSRTTime(cap.end);
        return \`\${indexStr}\\n\${startStr} --> \${endStr}\\n\${cap.text}\\n\`;
      })
      .join('\\n');
  }

  static secondsToSRTTime(totalSeconds: number): string {
    const sec = Math.max(0, totalSeconds);
    const hours = Math.floor(sec / 3600);
    const minutes = Math.floor((sec % 3600) / 60);
    const seconds = Math.floor(sec % 60);
    const ms = Math.floor((sec % 1) * 1000);

    const pad2 = (n: number) => n.toString().padStart(2, '0');
    const pad3 = (n: number) => n.toString().padStart(3, '0');

    return \`\${pad2(hours)}:\${pad2(minutes)}:\${pad2(seconds)},\${pad3(ms)}\`;
  }
}

  private future: T[] = [];

export class TimingEngine {
  /**
   * Format seconds to mm:ss.mmm (or hh:mm:ss.mmm if > 1 hour)
   */
  static formatTime(seconds: number, includeHours = false): string {
    if (isNaN(seconds) || seconds < 0) seconds = 0;
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = Math.floor(seconds % 60);
    const ms = Math.floor((seconds % 1) * 1000);

    const pad2 = (n: number) => n.toString().padStart(2, '0');
    const pad3 = (n: number) => n.toString().padStart(3, '0');

    if (includeHours || hrs > 0) {
      return \`\${pad2(hrs)}:\${pad2(mins)}:\${pad2(secs)}.\${pad3(ms)}\`;
    }
    return \`\${pad2(mins)}:\${pad2(secs)}.\${pad3(ms)}\`;
  }

  /**
   * Format seconds to standard mm:ss for timeline ruler
   */
  static formatRulerTime(seconds: number): string {
    if (isNaN(seconds) || seconds < 0) seconds = 0;
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    const pad2 = (n: number) => n.toString().padStart(2, '0');
    return \`\${pad2(mins)}:\${pad2(secs)}\`;
  }

  /**
   * Parse timestamp string to seconds
   */
  static parseTimeString(str: string): number {
    if (!str) return 0;
    const parts = str.trim().split(':');
    if (parts.length === 3) {
      const hrs = parseFloat(parts[0]) || 0;
      const mins = parseFloat(parts[1]) || 0;
      const secs = parseFloat(parts[2].replace(',', '.')) || 0;
      return hrs * 3600 + mins * 60 + secs;
    }
    if (parts.length === 2) {
      const mins = parseFloat(parts[0]) || 0;
      const secs = parseFloat(parts[1].replace(',', '.')) || 0;
      return mins * 60 + secs;
    }
    return parseFloat(str.replace(',', '.')) || 0;
  }

  /**
   * Binary search / fast lookup for active caption at currentTime
   */
  static getActiveCaption(captions: Caption[], currentTime: number): Caption | null {
    if (!captions || captions.length === 0) return null;

    // Fast check for single/few captions
    if (captions.length <= 16) {
      for (let i = 0; i < captions.length; i++) {
        const c = captions[i];
        if (currentTime >= c.start && currentTime <= c.end) {
          return c;
        }
      }
      return null;
    }

    // Binary search approach for larger arrays
    let low = 0;
    let high = captions.length - 1;

    while (low <= high) {
      const mid = Math.floor((low + high) / 2);
      const cap = captions[mid];

      if (currentTime >= cap.start && currentTime <= cap.end) {
        return cap;
      }
      if (currentTime < cap.start) {
        high = mid - 1;
      } else {
        low = mid + 1;
      }
    }

    return null;
  }

4K 60FPS Video Caption Editor with Speech Recognition, Word-Level Karaoke, 10 Styles & 16 Animations

## Features
- **4K Ultra HD & 60 FPS Export**: Full support for 3840x2160 UHD and vertical 2160x3840 reels at 60 frames per second.
- **Client-Side & Offline**: Operates 100% locally in your browser. No backend required, zero external API keys.
- **Frame-Accurate Timeline**: Trim, split, merge, duplicate, and reorder captions with sub-millisecond precision.
- **10 Dynamic Styles**: Viral, Karaoke, Minimal, Podcast, News, Cinematic, Neon, Bold Social, Corporate, Luxury.
- **16 Word Animations**: Pop, Bounce, Typewriter, Word Stagger, Blur Reveal, Elastic, Scale Punch, and more.
- **Karaoke Highlights**: Real-time spoken word scale, background badges, underlines, and custom accent fills.
- **Brand Kit & Brochure Color Picker**: EyeDropper integration and brochure image color extractor.
- **Safe Zone Presets**: 9:16 (TikTok/Reels/Shorts), 16:9, 1:1, and 4:5.
- **Subtitle & Video Export**: Instant .srt, .vtt, project .json, and burned-in .webm / .mp4 video downloads.

## How to Run Locally

### 1. Prerequisites
- Node.js (version 18 or higher)
- npm or pnpm or yarn

### 2. Setup
\`\`\`bash
# 1. Open a terminal in this extracted folder
cd captionflow-ai

# 2. Install dependencies
npm install

# 3. Start the local development server
npm run dev
\`\`\`

### 3. Open in Browser
Visit the URL shown in your terminal (typically **http://localhost:3000** or **http://localhost:5173**).

## Build for Production
To build a static production bundle:
\`\`\`bash
npm run build
\`\`\`
The static files will be generated in the \`dist/\` folder and can be served with any static web server (such as Nginx, Apache, or GitHub Pages).

    :root {
      --bg: #0b0d10;
      --panel: #12161b;
      --panel-hover: #192027;
      --panel-active: #202832;
      --border: #252b33;
      --border-light: #343c47;
      --accent: #f5b82e;
      --accent-hover: #e5a81e;
      --accent-glow: #f5b82e40;
      --text: #fff;
      --text-secondary: #cbd5e1;
      --muted: #8d96a3
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-track {
      background: var(--bg)
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted)
    }

    .cf-panel {
      background-color: var(--panel);
      border: 1px solid var(--border)
    }

    .cf-card {
      border: 1px solid var(--border);
      background-color: #161b22;
      transition: all .15s ease-in-out
    }

    .cf-card:hover {
      border-color: var(--border-light);
      background-color: var(--panel-hover)
    }

    .cf-btn-primary {
      background-color: var(--accent);
      color: #0b0d10;
      font-weight: 700;
      transition: all .15s ease-in-out
    }

    .cf-btn-primary:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 0 16px var(--accent-glow)
    }

    .cf-btn-secondary {
      border: 1px solid var(--border);
      color: var(--text);
      background-color: #1b2129;
      transition: all .15s ease-in-out
    }

    .cf-btn-secondary:hover {
      border-color: var(--border-light);
      background-color: #242d38
    }
